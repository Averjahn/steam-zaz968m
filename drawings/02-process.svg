жду котлом и защитой.</text><rect x="40" y="390" width="220" height="110" rx="8" fill="#f8fafc" stroke="#a16207" stroke-width="2"/><text x="52" y="417" font-size="16" fill="#a16207">Топливо / фильтр</text><text x="52" y="441" font-size="16" fill="#a16207">Насос / контроллер</text><text x="52" y="465" font-size="16" fill="#a16207">Отсечные клапаны</text><path d="M260,440 L825,440" stroke="#a16207" stroke-width="2" fill="none"/><path d="M825,440 L825,265" stroke="#a16207" stroke-width="2" fill="none"/><path d="M825,265 L890,265" stroke="#a16207" stroke-width="2" fill="none"/><path d="M890,265 L879.4690092573155,270.75310646325045" stroke="#a16207" stroke-width="2" fill="none"/><path d="M890,265 L879.4690092573155,259.24689353674955" stroke="#a16207" stroke-width="2" fill="none"/><text x="40" y="750" font-size="18" fill="#0f172a">Отвод продуктов сгорания — отдельный тракт. Пар, дым и горячая вода не проходят в салон.</text><text x="35" y="820" font-size="15" fill="#0f172a">Параметры соединений, сечения кабелей, уставки защиты и диаметры труб требуют отдельного рабочего проекта.</text></g></svg>