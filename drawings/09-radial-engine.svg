oke-width="5" stroke-dasharray="20 15"/><circle r="17" fill="#354c5c"/></g><text x="40" y="965" font-size="18">V = 7 × π × 0,100² × 0,120 / 4 = 6,6 л; Vдв = 12,81 л/цикл</text><text x="40" y="998" font-size="17">Кривошип r60; шатун L190; шток L180 / Ø24. Передача: модуль 5, зубья 28:56.</text><text x="40" y="1030" font-size="17">Зелёная рамка: прежний резерв 600 × 500. Патрубки и арматура на эскизе опущены.</text><text x="40" y="1064" font-size="17">Масса, прочность, момент, герметичность и посадка в кузов не подтверждены.</text></g></svg>
