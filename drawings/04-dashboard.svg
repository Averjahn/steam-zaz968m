<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" fill="#0f172a">04 • Предложение дополнительной приборной панели</text><text x="35" y="73" font-size="16" fill="#b91c1c">Эскиз / 08.10.2026 / Не монтажная схема / Уставки и характеристики по паспорту оборудования</text><rect x="90" y="150" width="1050.0" height="450.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><circle cx="202.5" cy="270.0" r="65.0" fill="none" stroke="#334155" stroke-width="2"/><text x="162.5" y="365.0" font-size="17" fill="#0f172a">Давление</text><text x="175.5" y="276.0" font-size="17" fill="#0f172a">Ø52*</text><circle cx="427.5" cy="270.0" r="65.0" fill="none" stroke="#334155" stroke-width="2"/><text x="387.5" y="365.0" font-size="17" fill="#0f172a">Температура пара</text><text x="400.5" y="276.0" font-size="17" fill="#0f172a">Ø52*</text><circle cx="652.5" cy="270.0" r="65.0" fill="none" stroke="#334155" stroke-width="2"/><text x="612.5" y="365.0" font-size="17" fill="#0f172a">Обороты</text><text x="625.5" y="276.0" font-size="17" fill="#0f172a">Ø52*</text><circle cx="877.5" cy="270.0" r="65.0" fill="none" stroke="#334155" stroke-width="2"/><text x="837.5" y="365.0" font-size="17" fill="#0f172a">Запас воды</text><text x="850.5" y="276.0" font-size="17" fill="#0f172a">Ø52*</text><rect x="377.5" y="430.0" width="350.0" height="100.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="389.5" y="457.0" font-size="16" fill="#334155">Статус установки / аварии</text><circle cx="202.5" cy="482.5" r="30.0" fill="none" stroke="#16a34a" stroke-width="2"/><text x="167.5" y="544.5" font-size="17" fill="#16a34a">СТАРТ</text><circle cx="290.0" cy="482.5" r="30.0" fill="none" stroke="#64748b" stroke-width="2"/><text x="255.0" y="544.5" font-size="17" fill="#64748b">СТОП</text><circle cx="915.0" cy="482.5" r="30.0" fill="none" stroke="#ef4444" stroke-width="2"/><text x="880.0" y="544.5" font-size="17" fill="#ef4444">АВАРИЯ</text><path d="M90,120 L1140.0,120" stroke="#334155" stroke-width="2" fill="none"/><text x="600.0" y="110" font-size="18" fill="#0f172a">420</text><path d="M1175.0,150 L1175.0,600.0" stroke="#334155" stroke-width="2" fill="none"/><text x="1185.0" y="375.0" font-size="18" fill="#0f172a">180</text><text x="90" y="665" font-size="18" fill="#0f172a">Все размеры панели — мм. Это целевой эскиз; место в штатной панели ЗАЗ не проверено.</text><text x="90" y="702" font-size="18" fill="#0f172a">* Посадочный диаметр зависит от выбранного прибора. Ø52 здесь условный.</text><text x="90" y="739" font-size="18" fill="#0f172a">В салон выводятся электрические сигналы. Датчики и механический манометр остаются у установки.</text><text x="35" y="820" font-size="15" fill="#0f172a">Параметры соединений, сечения кабелей, уставки защиты и диаметры труб требуют отдельного рабочего проекта.</text></g></svg>