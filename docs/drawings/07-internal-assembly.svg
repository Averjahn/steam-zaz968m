<text x="35" y="880" font-size="15">CND: два боковых блока, центральная часть свободна для ENG. Задний ряд сидений удаляется.</text>
<text x="35" y="905" font-size="15">Точные панели кузова — в GLB. Короб CND на этом листе охватывает оба блока; это не сплошной агрегат.</text>
<text x="35" y="930" font-size="15">Проверьте пересечения по internal-fit-audit.json. Теплоотвод 358 кВт не подтверждён.</text>
<text x="35" y="955" font-size="15">Площадки, болты, трубки и стенки не рассчитаны для изготовления. Для монтажа нужны обмеры и выбор изделий.</text>
