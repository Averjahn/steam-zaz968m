<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" fill="#0f172a">05 • ЗАЗ: вторая архитектура по примеру MSS VW</text><text x="35" y="73" font-size="16" fill="#b91c1c">Эскиз / 08.10.2026 / Не монтажная схема / Уставки и характеристики по паспорту оборудования</text><text x="70" y="130" font-size="19" fill="#0f172a">Вид сбоку. Предложение для ЗАЗ; размеры исторического VW не восстановлены.</text><rect x="70" y="520" width="1091.85" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="389.0" y="280" width="261.0" height="240" rx="8" fill="#f8fafc" stroke="#f43f5e" stroke-width="2"/><text x="418.0" y="340" font-size="17" fill="#0f172a">Два передних места</text><rect x="273.0" y="196.1" width="115.99999999999999" height="46.4" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/><text x="285.0" y="223.1" font-size="16" fill="#38bdf8">CND</text><rect x="162.8" y="523.8" width="203.0" height="46.4" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="174.8" y="550.8" font-size="16" fill="#2563eb">WTR</text><rect x="180.2" y="497.7" width="121.8" height="72.5" rx="8" fill="#f8fafc" stroke="#a78bfa" stroke-width="2"/><text x="192.2" y="524.7" font-size="16" fill="#a78bfa">ELE</text><rect x="789.1999999999999" y="480.29999999999995" width="145.0" height="101.5" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="801.1999999999999" y="507.29999999999995" font-size="16" fill="#94a3b8">GBX</text><rect x="939.9999999999999" y="428.09999999999997" width="174.0" height="145.0" rx="8" fill="#f8fafc" stroke="#fb923c" stroke-width="2"/><text x="951.9999999999999" y="455.09999999999997" font-size="16" fill="#fb923c">ENG</text><rect x="673.1999999999999" y="271.5" width="231.99999999999997" height="188.5" rx="8" fill="#f8fafc" stroke="#ef4444" stroke-width="2"/><text x="685.1999999999999" y="298.5" font-size="16" fill="#ef4444">STM</text><rect x="171.5" y="399.1" width="162.39999999999998" height="87.0" rx="8" fill="#f8fafc" stroke="#eab308" stroke-width="2"/><text x="183.5" y="426.1" font-size="16" fill="#eab308">FUE</text><rect x="910.9999999999999" y="390.4" width="81.19999999999999" height="52.199999999999996" rx="8" fill="#f8fafc" stroke="#14b8a6" stroke-width="2"/><text x="922.9999999999999" y="417.4" font-size="16" fill="#14b8a6">RCV</text><circle cx="302.0" cy="581.8" r="81.19999999999999" fill="none" stroke="#64748b" stroke-width="2"/><circle cx="928.4" cy="581.8" r="81.19999999999999" fill="none" stroke="#64748b" stroke-width="2"/><path d="M655.8,280 L655.8,680" stroke="#b91c1c" stroke-width="2" fill="none"/><text x="1160" y="205" font-size="17" fill="#0f172a">STM — генератор</text><text x="1160" y="240" font-size="17" fill="#0f172a">в зоне заднего сиденья</text><text x="1160" y="295" font-size="17" fill="#0f172a">CND — наружный</text><text x="1160" y="330" font-size="17" fill="#0f172a">конденсатор</text><text x="1160" y="385" font-size="17" fill="#0f172a">Перегородка показана</text><text x="1160" y="420" font-size="17" fill="#0f172a">как требование проекта;</text><text x="1160" y="455" font-size="17" fill="#0f172a">ее защита не рассчитана.</text><text x="70" y="750" font-size="18" fill="#0f172a">Все внутренние координаты, размеры и высоты — допущения. Посадка в реальный кузов не подтверждена.</text><text x="70" y="790" font-size="18" fill="#0f172a">Требуются новые расчеты массы, охлаждения, креплений, внешних выступов и защитного разделения салона.</text><text x="70" y="830" font-size="18" fill="#0f172a">Общие внешние размеры исходного ЗАЗ не сохраняются: наружный конденсатор выходит за габарит кузова.</text><text x="35" y="920" font-size="15" fill="#0f172a">Параметры соединений, сечения кабелей, уставки защиты и диаметры труб требуют отдельного рабочего проекта.</text></g></svg>