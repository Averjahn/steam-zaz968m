<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="25" fill="#0f172a">03 • Управление и независимые защиты</text><text x="35" y="73" font-size="16" fill="#b91c1c">Эскиз / 08.10.2026 / Не монтажная схема / Уставки и характеристики по паспорту оборудования</text><rect x="40" y="135" width="330" height="160" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="52" y="162" font-size="16" fill="#2563eb">Педаль / задатчик тяги</text><text x="52" y="186" font-size="16" fill="#2563eb">Старт / останов</text><text x="52" y="210" font-size="16" fill="#2563eb">Дисплей P, T, вода, обороты</text><text x="52" y="234" font-size="16" fill="#2563eb">Квитирование после проверки</text><text x="52" y="258" font-size="16" fill="#2563eb">Кнопка аварийного останова</text><rect x="500" y="135" width="320" height="160" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/><text x="512" y="162" font-size="16" fill="#7c3aed">Регулятор процесса</text><text x="512" y="186" font-size="16" fill="#7c3aed">Подача воды и горелка</text><text x="512" y="210" font-size="16" fill="#7c3aed">Запрос тяги к паровой машине</text><text x="512" y="234" font-size="16" fill="#7c3aed">Вентиляторы / питание</text><text x="512" y="258" font-size="16" fill="#7c3aed">Журнал ошибок</text><rect x="980" y="135" width="360" height="160" rx="8" fill="#f8fafc" stroke="#ea580c" stroke-width="2"/><text x="992" y="162" font-size="16" fill="#ea580c">Исполнительные устройства</text><text x="992" y="186" font-size="16" fill="#ea580c">Паровой клапан fail-close</text><text x="992" y="210" font-size="16" fill="#ea580c">Контроллер горелки</text><text x="992" y="234" font-size="16" fill="#ea580c">Питательный насос</text><text x="992" y="258" font-size="16" fill="#ea580c">Регулятор обдува</text><path d="M370,205 L500,205" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M500,205 L489.4690092573155,210.75310646325045" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M500,205 L489.4690092573155,199.24689353674955" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M820,205 L980,205" stroke="#7c3aed" stroke-width="2" fill="none"/><path d="M980,205 L969.4690092573155,210.75310646325045" stroke="#7c3aed" stroke-width="2" fill="none"/><path d="M980,205 L969.4690092573155,199.24689353674955" stroke="#7c3aed" stroke-width="2" fill="none"/><rect x="40" y="405" width="350" height="185" rx="8" fill="#f8fafc" stroke="#b91c1c" stroke-width="2"/><text x="52" y="432" font-size="16" fill="#b91c1c">Независимые входы защиты</text><text x="52" y="456" font-size="16" fill="#b91c1c">Предельное давление</text><text x="52" y="480" font-size="16" fill="#b91c1c">Предельная T стенки / пара</text><text x="52" y="504" font-size="16" fill="#b91c1c">Проток или низкий уровень*</text><text x="52" y="528" font-size="16" fill="#b91c1c">Пламя / давление топлива</text><text x="52" y="552" font-size="16" fill="#b91c1c">Предельные обороты</text><rect x="500" y="405" width="330" height="185" rx="8" fill="#f8fafc" stroke="#b91c1c" stroke-width="2"/><text x="512" y="432" font-size="16" fill="#b91c1c">Защитная цепь / контроллер</text><text x="512" y="456" font-size="16" fill="#b91c1c">Останов топлива и тяги</text><text x="512" y="480" font-size="16" fill="#b91c1c">Контроль обрыва / питания</text><text x="512" y="504" font-size="16" fill="#b91c1c">Защелка аварии</text><text x="512" y="528" font-size="16" fill="#b91c1c">Ручной сброс после проверки</text><text x="512" y="552" font-size="16" fill="#b91c1c">Без автоматического рестарта</text><rect x="980" y="405" width="360" height="185" rx="8" fill="#f8fafc" stroke="#b91c1c" stroke-width="2"/><text x="992" y="432" font-size="16" fill="#b91c1c">Отдельные защитные выходы</text><text x="992" y="456" font-size="16" fill="#b91c1c">Снять разрешение горелки</text><text x="992" y="480" font-size="16" fill="#b91c1c">Закрыть топливные клапаны</text><text x="992" y="504" font-size="16" fill="#b91c1c">Закрыть паровой стоп-клапан</text><text x="992" y="528" font-size="16" fill="#b91c1c">Послепродувка / охлаждение</text><text x="992" y="552" font-size="16" fill="#b91c1c">По алгоритму изготовителя</text><path d="M390,475 L500,475" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M500,475 L489.4690092573155,480.75310646325045" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M500,475 L489.4690092573155,469.24689353674955" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M830,475 L980,475" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M980,475 L969.4690092573155,480.75310646325045" stroke="#b91c1c" stroke-width="2" fill="none"/><path d="M980,475 L969.4690092573155,469.24689353674955" stroke="#b91c1c" stroke-width="2" fill="none"/><text x="40" y="655" font-size="17" fill="#0f172a">* Для проточного генератора — проток и температура стенки; уровень только в емкостях, где он физически применим.</text><text x="40" y="690" font-size="17" fill="#0f172a">Потеря экрана не должна отменять защиты. Механический предохранительный клапан действует независимо.</text><text x="40" y="725" font-size="17" fill="#0f172a">Аварийный останов не означает резкое опорожнение котла. Остаточное тепло и давление сохраняются.</text><text x="35" y="820" font-size="15" fill="#0f172a">Параметры соединений, сечения кабелей, уставки защиты и диаметры труб требуют отдельного рабочего проекта.</text></g></svg>